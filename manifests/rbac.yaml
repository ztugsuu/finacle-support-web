apiVersion: v1
kind: ServiceAccount
metadata:
  name: finacle-support-sa
  namespace: pre-uat-finacle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finacle-support-role
  namespace: pre-uat-finacle
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: finacle-support-binding
  namespace: pre-uat-finacle
subjects:
  - kind: ServiceAccount
    name: finacle-support-sa
    namespace: pre-uat-finacle
roleRef:
  kind: Role
  name: finacle-support-role
  apiGroup: rbac.authorization.k8s.io
