apiVersion: apps/v1
kind: Deployment
metadata:
  name: finacle-support-web
  namespace: pre-uat-finacle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finacle-support-web
  template:
    metadata:
      labels:
        app: finacle-support-web
    spec:
      serviceAccountName: finacle-support-sa
      # Allow an in-flight multi-ConfigMap operation to finish during web updates.
      terminationGracePeriodSeconds: 1830
      imagePullSecrets:
        - name: securereg
      containers:
        - name: finacle-support-web
          image: securereg.m-bank.mn:5000/finacle-support-web:3.0
          env:
            - name: NAMESPACE
              value: pre-uat-finacle
            - name: LDAP_URL
              value: "ldap://172.18.31.10:389"
            - name: LDAP_BASE_DN
              value: "dc=mbank,dc=local"
            # Confirmed LDAP login attribute: sAMAccountName.
            - name: LDAP_USERNAME_ATTRIBUTE
              value: "sAMAccountName"
            - name: LDAP_BIND_DN
              value: "openshift@mbank.local"
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-ldap-bind-password
                  key: bindPassword
            - name: LDAP_INSECURE
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: finacle-support-auth
                  key: SECRET_KEY
            - name: SESSION_COOKIE_SECURE
              value: "true" # HTTPS required; false only for local HTTP development
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          resources:
            limits:
              cpu: "8"
              memory: "12Gi"
            requests:
              cpu: "100m"
              memory: "128Mi"
