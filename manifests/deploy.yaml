apiVersion: apps/v1
kind: Deployment
metadata:
  name: finacle-support-web
  namespace: pre-uat-finacle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finacle-support-web
  template:
    metadata:
      labels:
        app: finacle-support-web
    spec:
      serviceAccountName: finacle-support-sa
      imagePullSecrets:
        - name: securereg
      containers:
        - name: finacle-support-web
          image: securereg.m-bank.mn:5000/finacle-support-web:1.0
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
